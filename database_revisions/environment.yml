# Conda environment for the database revisions.
# Create it inside database_revisions/ with:
#   conda env create -p .conda -f environment.yml
# and run a notebook end to end with:
#   .conda/bin/python -m nbconvert --to notebook --execute --inplace <notebook>
name: gauchos-database-revisions
channels:
  - conda-forge
dependencies:
  - python=3.14
  # Database access, with the address read from backend/.env
  - psycopg
  - python-dotenv
  # Hebrew calendar conversions
  - pyluach=2.3.0
  # Notebooks and code checks
  - ipykernel
  - nbconvert
  - nbformat
  - pylint
