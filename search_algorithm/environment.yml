# Conda environment for the name-search experiments.
# Create it inside search_algorithm/ with:
#   conda env create -p .conda -f environment.yml
#   .conda/bin/pip install --no-deps abydos==0.5.0
# Abydos (Beider–Morse and Daitch–Mokotoff in Python) is installed without its
# dependencies because its pinned requirements no longer resolve; numpy and
# deprecation, which it needs at run time, are listed below.
name: gauchos-search
channels:
  - conda-forge
dependencies:
  - python=3.14
  # Numerics, statistics and the K4 logistic regression
  - numpy
  - scipy
  - scikit-learn
  # Embedding models (E1–E4) and their weights
  - pytorch
  - safetensors
  - sentence-transformers
  - huggingface_hub
  # Name handling
  - anyascii
  - deprecation
  # Local PostgreSQL cluster for L2 (pg_trgm) and L3 (fuzzystrmatch)
  - postgresql>=16
  - psycopg
  # Optional LLM fallback for QS2 diaspora spellings
  - anthropic
  # Notebooks and code checks
  - ipykernel
  - nbconvert
  - nbformat
  - pylint
  - pytest
  - python-dotenv
  - pip
